[project]
name = "prospector"
version = "0.1.0"
description = "An ingestion and evaluation pipeline that mines, filters and ranks project ideas from public sources."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Ian Olave", email = "iolave0646@gmail.com" }]
keywords = ["data-engineering", "data-pipeline", "ingestion", "evaluation"]
dependencies = [
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.32",
]

[project.scripts]
prospector = "prospector.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prospector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
